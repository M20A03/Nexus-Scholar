name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Quality Gate (Linting, Formatting, Strict Type Checking, Tests)
  # --------------------------------------------------------------------------
  quality-gate:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Environment Variable Validation
        working-directory: ./frontend
        run: |
          echo "Validating environment configuration..."
          test -n "${{ secrets.VITE_API_BASE_URL || 'default' }}" || (echo "Missing VITE_API_BASE_URL" && exit 1)

      - name: Run TypeScript Strict Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Verify Production Bundle Build
        working-directory: ./frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # Stage 2: Staging Deployment & Automated E2E Testing
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging & Run E2E
    needs: quality-gate
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Staging to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy-staging
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Run Playwright E2E Smoke Tests against Staging URL
        run: |
          echo "Running cross-browser / mobile viewport smoke tests on ${{ steps.vercel-deploy-staging.outputs.preview-url }}..."
          # npx playwright test --config=playwright.config.ts

  # --------------------------------------------------------------------------
  # Stage 3: Production Promotion
  # --------------------------------------------------------------------------
  deploy-production:
    name: Promote to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Production to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
