version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orkg_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orkg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orkg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orkg_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/orkg_db
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - SECRET_KEY=${SECRET_KEY:-orkg-super-secret-key-12345}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orkg_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
